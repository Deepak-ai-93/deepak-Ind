name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ind-linux-x86_64
            asset_name: ind-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ind-linux-aarch64
            asset_name: ind-linux-aarch64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: ind-macos-x86_64
            asset_name: ind-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ind-macos-aarch64
            asset_name: ind-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: ind-windows-x86_64
            asset_name: ind-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build target
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ind staging/
          cp README.md LICENSE staging/
          cd staging
          tar -czvf ../${{ matrix.asset_name }} *
        shell: bash

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/ind.exe staging/
          cp README.md LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset_name }}
        shell: pwsh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
