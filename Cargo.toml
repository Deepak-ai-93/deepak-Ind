[package]
name = "ind"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ind"
path = "src-rust/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
colored = "2.1"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
regex = "1.10"
directories = "5.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
futures-util = "0.3"
rustyline = "14.0"


